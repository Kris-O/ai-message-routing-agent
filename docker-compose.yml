services:
  api:
    build: .
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: "hf.co/unsloth/Qwen3-4B-Instruct-2507-GGUF:UD-Q4_K_XL"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAIL_FROM: router@firma.pl
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_MODEL: "hf.co/unsloth/Qwen3-4B-Instruct-2507-GGUF:UD-Q4_K_XL"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./docker/ollama-entrypoint.sh:/entrypoint.sh:ro
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -qi qwen3-4b-instruct || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 240s

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  ollama-data:
